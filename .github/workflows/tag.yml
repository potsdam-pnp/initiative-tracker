name: Deploy to GitHub Pages

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21' # Or your desired JDKversion
          distribution: 'temurin'
      - name: Tests
        run: ./gradlew allTests -x wasmJsBrowserTest
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()    # run this step even if previous step failed
        with:
          name: Test Results
          path: composeApp/build/test-results/**/*.xml
          reporter: java-junit
      - name: Build Android apk
        run: ./gradlew assemble
      - name: Sign app
        run: |
          echo $RELEASE_KEY | base64 --decode > key.jks
          ls -l /usr/local/lib/android/sdk
          ls -l /usr/local/lib/android/sdk/build-tools
          ls -l /usr/local/lib/android/sdk/build-tools/35.0.0
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --in composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk --ks key.jks --ks-pass pass:android
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
      - name: Publish release apk
        uses: svenstaro/upload-release-action@v2
        with:
          file: composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk
          asset_name: app-release.apk
